[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regops"
version = "0.1.0"
description = "Local deterministic runtime plane for RegOps"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: optional tests that call external services",
]
